name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: -A x64
          - name: macOS
            os: macos-latest
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libegl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          exe=$(find build -type f \( -name VoxBloomTests -o -name VoxBloomTests.exe \) -path "*Release*" | head -1)
          "$exe"

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          art=build/VoxBloom_artefacts/Release
          cp -R "$art/VST3/VoxBloom.vst3" dist/
          if [ -d "$art/AU" ]; then cp -R "$art/AU/VoxBloom.component" dist/; fi
          if [ -d "$art/Standalone" ]; then cp -R "$art/Standalone/"* dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VoxBloom-${{ matrix.name }}
          path: dist
